<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
            .bg { fill: #060913; }
            .grid { stroke: rgba(0, 210, 255, 0.05); stroke-width: 1; }
            .title { font-family: 'Share Tech Mono', monospace; font-size: 28px; fill: #00d2ff; font-weight: bold; text-anchor: middle; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,210,255,0.6); }
            .subtitle { font-family: 'Share Tech Mono', monospace; font-size: 16px; fill: #0ea5e9; text-anchor: middle; }
            .binary { font-family: monospace; font-size: 10px; fill: rgba(0,210,255,0.15); }
            .shield { fill: none; stroke: #00d2ff; stroke-width: 3; filter: drop-shadow(0 0 10px #00d2ff); }
            .scan-line { fill: rgba(0,210,255,0.3); filter: drop-shadow(0 0 5px #00d2ff); }
            .path-text { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #94a3b8; letter-spacing: 1px; }
        </style>
    </defs>

    <!-- Background -->
    <rect width="800" height="250" class="bg" rx="10" />

    <!-- Grid lines -->
    <g class="grid">
        <line x1="0" y1="50" x2="800" y2="50" />
        <line x1="0" y1="100" x2="800" y2="100" />
        <line x1="0" y1="150" x2="800" y2="150" />
        <line x1="0" y1="200" x2="800" y2="200" />
        <line x1="200" y1="0" x2="200" y2="250" />
        <line x1="400" y1="0" x2="400" y2="250" />
        <line x1="600" y1="0" x2="600" y2="250" />
    </g>

    <!-- Binary Background -->
    <text x="30" y="40" class="binary">01100011 01111001 01100010 01100101 01110010</text>
    <text x="550" y="60" class="binary">01110011 01100101 01100011 01110101 01110010 01101001 01110100 01111001</text>
    <text x="60" y="210" class="binary">01010000 01100101 01101110 01110100 01100101 01110011 01110100</text>
    <text x="600" y="220" class="binary">01001111 01010111 01000001 01010011 01010000</text>

    <!-- Shield Icon -->
    <g transform="translate(360, 70)">
        <path d="M40 0 L0 15 L0 45 C0 70 15 90 40 110 C65 90 80 70 80 45 L80 15 Z" class="shield" />
        <path d="M30 45 L40 55 L55 35" fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Scanning Line inside Shield -->
    <rect x="360" y="110" width="80" height="2" class="scan-line">
        <animate attributeName="y" values="70;180;70" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Text Elements -->
    <text x="400" y="45" class="title">CYBERSECURITY OPERATIONS</text>
    <text x="400" y="215" class="subtitle">Penetration Testing | AppSec | Ethical Hacking</text>

    <!-- Target Brackets -->
    <path d="M 280 190 L 270 190 L 270 200" fill="none" stroke="#00d2ff" stroke-width="2" />
    <path d="M 520 190 L 530 190 L 530 200" fill="none" stroke="#00d2ff" stroke-width="2" />
    <path d="M 280 230 L 270 230 L 270 220" fill="none" stroke="#00d2ff" stroke-width="2" />
    <path d="M 520 230 L 530 230 L 530 220" fill="none" stroke="#00d2ff" stroke-width="2" />
</svg>
