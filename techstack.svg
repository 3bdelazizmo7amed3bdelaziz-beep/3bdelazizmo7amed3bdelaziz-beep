<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&amp;display=swap');
            .bg { fill: #060913; }
            .border { stroke: #00d2ff; stroke-width: 1; stroke-opacity: 0.3; fill: none; }
            .title { font-family: 'Ubuntu Mono', monospace; font-size: 22px; fill: #00d2ff; font-weight: bold; text-anchor: middle; text-shadow: 0 0 8px rgba(0,210,255,0.5); }
            .label { font-family: 'Ubuntu Mono', monospace; font-size: 14px; fill: #94a3b8; }
            .percent { font-family: 'Ubuntu Mono', monospace; font-size: 14px; fill: #0ea5e9; text-anchor: end; font-weight: bold; }
            .bar-bg { fill: #1e293b; rx: 4; }
            .bar-fill-1 { fill: #00d2ff; rx: 4; filter: drop-shadow(0 0 4px #00d2ff); }
            .bar-fill-2 { fill: #0ea5e9; rx: 4; filter: drop-shadow(0 0 4px #0ea5e9); }
            .bar-fill-3 { fill: #3b82f6; rx: 4; filter: drop-shadow(0 0 4px #3b82f6); }
            .bar-fill-4 { fill: #60a5fa; rx: 4; filter: drop-shadow(0 0 4px #60a5fa); }
        </style>
    </defs>

    <rect width="800" height="250" class="bg" rx="10" />
    <rect x="20" y="20" width="760" height="210" class="border" rx="8" />

    <text x="400" y="50" class="title">⚡ TECH STACK PROGRESS ⚡</text>

    <!-- Column 1 -->
    <text x="50" y="100" class="label">C# / .NET</text>
    <rect x="180" y="88" width="180" height="14" class="bar-bg" />
    <rect x="180" y="88" width="165" height="14" class="bar-fill-1" />
    <text x="390" y="100" class="percent">95%</text>

    <text x="50" y="140" class="label">ASP.NET Core</text>
    <rect x="180" y="128" width="180" height="14" class="bar-bg" />
    <rect x="180" y="128" width="155" height="14" class="bar-fill-2" />
    <text x="390" y="140" class="percent">90%</text>

    <text x="50" y="180" class="label">SQL Server</text>
    <rect x="180" y="168" width="180" height="14" class="bar-bg" />
    <rect x="180" y="168" width="155" height="14" class="bar-fill-3" />
    <text x="390" y="180" class="percent">90%</text>

    <!-- Column 2 -->
    <text x="430" y="100" class="label">Penetration Test</text>
    <rect x="560" y="88" width="180" height="14" class="bar-bg" />
    <rect x="560" y="88" width="155" height="14" class="bar-fill-4" />
    <text x="770" y="100" class="percent">85%</text>

    <text x="430" y="140" class="label">Docker / CI-CD</text>
    <rect x="560" y="128" width="180" height="14" class="bar-bg" />
    <rect x="560" y="128" width="140" height="14" class="bar-fill-1" />
    <text x="770" y="140" class="percent">80%</text>

    <text x="430" y="180" class="label">Angular / React</text>
    <rect x="560" y="168" width="180" height="14" class="bar-bg" />
    <rect x="560" y="168" width="135" height="14" class="bar-fill-2" />
    <text x="770" y="180" class="percent">75%</text>

</svg>
